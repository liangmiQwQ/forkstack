name: Deploy app

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency: deploy-forkstack-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
      - name: Deploy to Cloudflare
        working-directory: packages/app
        # Cloudflare requires atomic publication when v0.2.1 introduces the live-v1 Durable Object.
        run: pnpm run deploy --platform cloudflare ${{ inputs.ref == 'refs/tags/v0.2.1' && '--atomic' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
